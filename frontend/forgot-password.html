<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password - OCMS</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff6a00,#ee0979);
}

.container{
    width:400px;
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
    text-align:center;
}

h2{
    color:#ee0979;
    margin-bottom:10px;
}

p{
    color:#666;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:12px;
    border:2px solid #ddd;
    border-radius:10px;
    margin-bottom:15px;
    outline:none;
}

input:focus{
    border-color:#ee0979;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:linear-gradient(135deg,#ff6a00,#ee0979);
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    opacity:0.9;
}

.back{
    display:block;
    margin-top:15px;
    color:#ee0979;
    text-decoration:none;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

    <h2>Forgot Password</h2>

    <p>Enter your email address to reset your password.</p>

    <form onsubmit="resetPassword(event)">
        <input type="email" placeholder="Enter Registered Email" required>

        <button type="submit">Send Reset Link</button>
    </form>

    <a href="login.html" class="back">← Back to Login</a>

</div>

<script>
function resetPassword(event){
    event.preventDefault();

    alert("Password reset link sent to your email!");

    window.location.href="login.html";
}
</script>

</body>
</html>
