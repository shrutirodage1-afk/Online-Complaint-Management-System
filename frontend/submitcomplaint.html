<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Submit Complaint</title>

<style>
body{
    font-family:Poppins,sans-serif;
    background:#f4f6f9;
    margin:0;
}

/* SIDEBAR */
.sidebar{
    width:230px;
    height:100vh;
    position:fixed;
    left:0;
    top:0;
    background:linear-gradient(135deg,#ff6a00,#ee0979);
    padding-top:20px;
}

.sidebar h2{
    text-align:center;
    color:white;
    margin-bottom:30px;
}

.sidebar a{
    display:block;
    color:white;
    text-decoration:none;
    padding:15px 25px;
    transition:.3s;
}

.sidebar a:hover{
    background:rgba(255,255,255,.2);
    transform:translateX(5px);
}

.sidebar a.active {
    background: rgba(255, 255, 255, 0.25);
    border-left: 4px solid white;
}

.container{
    width:500px;
    margin:50px auto 50px 300px; /* Adjusted left margin to clear the layout sidebar */
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 10px 20px rgba(0,0,0,.15);
}

h2{
    text-align:center;
    color:#ee0979;
}

input,select,textarea{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ddd;
    border-radius:8px;
    font-family: 'Poppins', sans-serif;
    box-sizing: border-box;
}

/* CAMERA & UPLOAD CONTROLS */
.media-options {
    display: flex;
    gap: 10px;
    margin: 10px 0;
}

.upload-box, .camera-btn-trigger {
    flex: 1;
    border: 2px dashed #ee0979;
    padding: 12px;
    text-align: center;
    border-radius: 10px;
    cursor: pointer;
    background: #fff;
    font-weight: 500;
    color: #ee0979;
    transition: 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Poppins', sans-serif;
}

.upload-box:hover, .camera-btn-trigger:hover {
    background: #fff5f8;
}

.upload-box input {
    display: none;
}

/* LIVE CAMERA STREAM CONTAINER */
.camera-container {
    display: none;
    flex-direction: column;
    align-items: center;
    background: #000;
    border-radius: 10px;
    padding: 10px;
    margin: 10px 0;
}

#webcam {
    width: 100%;
    max-height: 300px;
    border-radius: 8px;
    object-fit: cover;
}

.capture-btn {
    margin-top: 10px;
    background: #ee0979;
    padding: 8px 20px;
    width: auto;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:linear-gradient(135deg,#ff6a00,#ee0979);
    color:white;
    cursor:pointer;
    font-weight: 600;
}

button:hover{
    transform:scale(1.03);
}

#preview{
    width:100%;
    margin-top:10px;
    border-radius:10px;
    display:none;
}

.message{
    display:none;
    margin-top:15px;
    padding:15px;
    background:#d4edda;
    color:#155724;
    border-radius:8px;
    text-align:center;
    font-weight: bold;
    border: 1px solid #c3e6cb;
}

/* Language selector placement in header context */
.header-container {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.lang-switcher select {
    padding: 6px 10px;
    border-radius: 8px;
    border: 1px solid #ddd;
    background: white;
    color: #333;
    cursor: pointer;
}
</style>
</head>
<body>

<div class="sidebar">
    <h2>OCMS</h2>
    <a href="dashboard.html" data-i18n="nav_dashboard">🏠 Dashboard</a>
    <a href="submitcomplaint.html" class="active" data-i18n="nav_submit">📝 Submit Complaint</a>
    <a href="my-complaint.html" data-i18n="nav_myComplaints">📋 My Complaints</a>
    <a href="track-complaint.html" data-i18n="nav_track">🔍 Track Complaint</a>
    <a href="profile.html" data-i18n="nav_profile">👤 Profile</a>
    
    <a href="logout.html" data-i18n="nav_logout">🚪 Logout</a>
</div>

<div class="container">

    <div class="header-container">
        <h2 data-i18n="form_title">Submit Complaint</h2>
        <div class="lang-switcher">
            <select id="langSelect">
                <option value="en">English</option>
                <option value="hi">हिन्दी</option>
                <option value="mr">मराठी</option>
                <option value="es">Español</option>
            </select>
        </div>
    </div>

    <form id="complaintForm">
        <input type="text" id="title" placeholder="Complaint Title" required data-i18n-holder="place_title">

        <select id="category" required>
            <option value="" data-i18n="cat_select">Select Category</option>
            <option value="Water Issue" data-i18n="cat_water">Water Issue</option>
            <option value="Electricity" data-i18n="cat_electricity">Electricity</option>
            <option value="Road Problem" data-i18n="cat_road">Road Problem</option>
            <option value="Others" data-i18n="cat_others">Others</option>
        </select>

        <textarea id="description" rows="4" placeholder="Complaint Description" required data-i18n-holder="place_desc"></textarea>

        <input type="text" id="location" placeholder="Location" required data-i18n-holder="place_loc">

        <div class="media-options">
            <div class="upload-box">
                <label style="cursor: pointer; width: 100%;">
                    <span data-i18n="upload_label">📷 Upload Image</span>
                    <input type="file" id="imageInput" accept="image/*">
                </label>
            </div>
            <div class="camera-btn-trigger" id="startCameraBtn">
                <span data-i18n="camera_label">📸 Take Photo</span>
            </div>
        </div>

        <div class="camera-container" id="cameraContainer">
            <video id="webcam" autoplay playsinline></video>
            <button type="button" class="capture-btn" id="captureBtn">Capture</button>
        </div>

        <canvas id="canvas" style="display:none;"></canvas>

        <img id="preview" alt="Preview Image">

        <button type="submit" id="submitBtn" data-i18n="btn_submit">Submit Complaint</button>
    </form>

    <div class="message" id="msg"></div>

</div>

<script src="js/api.js"></script>
<script>
    // ===== Multi Language Configurations Dictionary Data =====
    const translations = {
        en: {
            nav_dashboard: "🏠 Dashboard",
            nav_submit: "📝 Submit Complaint",
            nav_myComplaints: "📋 My Complaints",
            nav_track: "🔍 Track Complaint",
            nav_profile: "👤 Profile",
          
            nav_logout: "🚪 Logout",
            form_title: "Submit Complaint",
            place_title: "Complaint Title",
            cat_select: "Select Category",
            cat_water: "Water Issue",
            cat_electricity: "Electricity",
            cat_road: "Road Problem",
            cat_others: "Others",
            place_desc: "Complaint Description",
            place_loc: "Location",
            upload_label: "📷 Upload Image",
            camera_label: "📸 Take Photo",
            btn_submit: "Submit Complaint",
            success_msg: "✅ Complaint Submitted Successfully — ID: ",
            notif_title: "Complaint Status",
            notif_body: "Your complaint has been successfully registered!"
        },
        hi: {
            nav_dashboard: "🏠 डैशबोर्ड",
            nav_submit: "📝 शिकायत दर्ज करें",
            nav_myComplaints: "📋 मेरी शिकायतें",
            nav_track: "🔍 शिकायत ट्रैक करें",
            nav_profile: "👤 प्रोफ़ाइल",
           
            nav_logout: "🚪 लॉगआउट",
            form_title: "शिकायत दर्ज करें",
            place_title: "शिकायत का शीर्षक",
            cat_select: "श्रेणी चुनें",
            cat_water: "पानी की समस्या",
            cat_electricity: "बिजली की समस्या",
            cat_road: "सड़क की समस्या",
            cat_others: "अन्य",
            place_desc: "शिकायत का विवरण",
            place_loc: "स्थान",
            upload_label: "📷 छवि अपलोड करें",
            camera_label: "📸 फोटो खींचे",
            btn_submit: "शिकायत जमा करें",
            success_msg: "✅ शिकायत सफलतापूर्वक दर्ज की गई — आईडी: ",
            notif_title: "शिकायत की स्थिति",
            notif_body: "आपकी शिकायत सफलतापूर्वक दर्ज की गई है!"
        },
        mr: {
            nav_dashboard: "🏠 डॅशबोर्ड",
            nav_submit: "📝 तक्रार नोंदवा",
            nav_myComplaints: "📋 माझ्या तक्रारी",
            nav_track: "🔍 तक्रार ट्रॅक करा",
            nav_profile: "👤 प्रोफाइल",
         
            nav_logout: "🚪 लॉगआउट",
            form_title: "तक्रार नोंदवा",
            place_title: "तक्रारीचे शीर्षक",
            cat_select: "वर्ग निवडा",
            cat_water: "पाण्याची समस्या",
            cat_electricity: "वीज समस्या",
            cat_road: "रस्त्याची समस्या",
            cat_others: "इतर",
            place_desc: "तक्रारीचे वर्णन",
            place_loc: "ठिकाण",
            upload_label: "📷 फोटो अपलोड करा",
            camera_label: "📸 फोटो काढा",
            btn_submit: "तक्रार सादर करा",
            success_msg: "✅ तक्रार यशस्वीरित्या नोंदवली गेली — आयडी: ",
            notif_title: "तक्रार स्थिती",
            notif_body: "तुमची तक्रार यशस्वीरीत्या नोंदवली गेली आहे!"
        },
        es: {
            nav_dashboard: "🏠 Panel",
            nav_submit: "📝 Enviar Queja",
            nav_myComplaints: "📋 Mis Quejas",
            nav_track: "🔍 Rastrear Queja",
            nav_profile: "👤 Perfil",
          
            nav_logout: "🚪 Cerrar Sesión",
            form_title: "Enviar Queja",
            place_title: "Título de la Queja",
            cat_select: "Selecciona Categoría",
            cat_water: "Problema de Agua",
            cat_electricity: "Electricidad",
            cat_road: "Problema de Carretera",
            cat_others: "Otros",
            place_desc: "Descripción de la Queja",
            place_loc: "Ubicación",
            upload_label: "📷 Subir Imagen",
            camera_label: "📸 Tomar Foto",
            btn_submit: "Enviar Queja",
            success_msg: "✅ Queja Enviada con Éxito — ID: ",
            notif_title: "Estado de la Queja",
            notif_body: "¡Su queja ha sido registrada con éxito!"
        }
    };

    function getSavedLang() {
        return localStorage.getItem("ocms_lang") || "en";
    }

    function setSavedLang(lang) {
        localStorage.setItem("ocms_lang", lang);
    }

    function applyTranslations(lang) {
        const dict = translations[lang] || translations.en;
        
        document.querySelectorAll("[data-i18n]").forEach(el => {
            const key = el.getAttribute("data-i18n");
            if (dict[key]) {
                el.textContent = dict[key];
            }
        });

        document.querySelectorAll("[data-i18n-holder]").forEach(el => {
            const key = el.getAttribute("data-i18n-holder");
            if (dict[key]) {
                el.placeholder = dict[key];
            }
        });

        document.documentElement.lang = lang;
    }

    const langSelect = document.getElementById("langSelect");
    const initialLang = getSavedLang();
    langSelect.value = initialLang;

    langSelect.addEventListener("change", (e) => {
        const lang = e.target.value;
        setSavedLang(lang);
        applyTranslations(lang);
    });

    applyTranslations(initialLang);

    if (typeof OCMC !== 'undefined' && typeof OCMC.requireAuth === 'function') {
        OCMC.requireAuth();
    }

    let imageFile = null;
    let streamRef = null;
    let cameraPhotoDataUrl = null; 

    const video = document.getElementById("webcam");
    const canvas = document.getElementById("canvas");
    const cameraContainer = document.getElementById("cameraContainer");
    const previewImg = document.getElementById("preview");

    if (window.Notification && Notification.permission !== "granted" && Notification.permission !== "denied") {
        Notification.requestPermission();
    }

    // UPDATED: Text-to-Speech specifically optimized to select a Female Voice
    function playNotificationSound() {
        try {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Reset active audio cues

                const messageText = "Your complaint has been submitted successfully";
                const utterance = new SpeechSynthesisUtterance(messageText);
                
                utterance.lang = 'en-US';
                utterance.volume = 1.0; 
                utterance.rate = 0.92;  // Slightly soft and elegant pace
                utterance.pitch = 1.1;  // Slightly higher pitch characteristic of a female tone

                // Filter out available female voices inside system engine
                const voices = window.speechSynthesis.getVoices();
                const femaleVoice = voices.find(voice => 
                    (voice.name.includes('Female') || 
                     voice.name.includes('Zira') || 
                     voice.name.includes('Google US English') || 
                     voice.name.includes('Hazel') ||
                     voice.name.includes('Samantha')) && voice.lang.startsWith('en')
                );

                if (femaleVoice) {
                    utterance.voice = femaleVoice;
                }

                window.speechSynthesis.speak(utterance);
                console.log("Female voice notification executed successfully.");
            } else {
                console.warn("Speech Synthesis not supported.");
            }
        } catch (e) {
            console.error("Voice synthesis failed:", e);
        }
    }

    // Pre-load voices for browsers that handle async retrieval (Chrome/Edge)
    if ('speechSynthesis' in window) {
        window.speechSynthesis.onvoiceschanged = () => {
            window.speechSynthesis.getVoices();
        };
    }

    function triggerSystemNotification(lang, complaintId) {
        if (window.Notification && Notification.permission === "granted") {
            const dict = translations[lang] || translations.en;
            new Notification(dict.notif_title, {
                body: `${dict.notif_body} (ID: ${complaintId})`,
                icon: 'https://cdn-icons-png.flaticon.com/512/190/190411.png'
            });
        }
    }

    document.getElementById("imageInput").addEventListener("change", function(e){
        stopCamera();
        cameraPhotoDataUrl = null; 
        const file = e.target.files[0];
        if(file){
            imageFile = file;
            const reader = new FileReader();
            reader.onload = function(event){
                previewImg.src = event.target.result;
                previewImg.style.display = "block";
            };
            reader.readAsDataURL(file);
        }
    });

    document.getElementById("startCameraBtn").addEventListener("click", async function() {
        previewImg.style.display = "none";
        imageFile = null;
        try {
            streamRef = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
            video.srcObject = streamRef;
            cameraContainer.style.display = "flex";
        } catch (err) {
            alert("Unable to access camera. Please verify site permissions.");
        }
    });

    document.getElementById("captureBtn").addEventListener("click", function() {
        if (streamRef) {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            cameraPhotoDataUrl = canvas.toDataURL("image/jpeg");
            previewImg.src = cameraPhotoDataUrl;
            previewImg.style.display = "block";
            imageFile = null; 

            stopCamera();
        }
    });

    function stopCamera() {
        if (streamRef) {
            streamRef.getTracks().forEach(track => track.stop());
            video.srcObject = null;
        }
        cameraContainer.style.display = "none";
    }

    async function getCameraFile(dataUrl) {
        const res = await fetch(dataUrl);
        const blob = await res.blob();
        return new File([blob], "snapshot.jpg", { type: "image/jpeg" });
    }

    // Submit Logic 
    document.getElementById("complaintForm").addEventListener("submit", async function(e){
        e.preventDefault();
        
        const submitBtn = document.getElementById("submitBtn");
        const msgDiv = document.getElementById("msg");
        
        submitBtn.disabled = true;
        msgDiv.style.display = "none";

        try {
            console.log("Preparing form data submission...");
            
            if (cameraPhotoDataUrl && !imageFile) {
                imageFile = await getCameraFile(cameraPhotoDataUrl);
            }

            const formData = new FormData();
            formData.append("title", document.getElementById("title").value);
            formData.append("category", document.getElementById("category").value);
            formData.append("description", document.getElementById("description").value);
            formData.append("location", document.getElementById("location").value);
            if (imageFile) formData.append("image", imageFile);

            if (typeof OCMC === 'undefined' || !OCMC.submitComplaint) {
                throw new Error("OCMC global library implementation is missing or js/api.js failed to parse.");
            }

            // Call API
            const data = await OCMC.submitComplaint(formData);
            console.log("API Success Response:", data);

            const activeLang = getSavedLang();
            const successString = translations[activeLang]?.success_msg || translations.en.success_msg;

            const complaintId = data && data.complaint ? data.complaint.complaintId : (data?.complaintId || data?.id || Math.floor(100000 + Math.random() * 900000));

            // 1. PLAY VOICE IN FEMALE DIALECT IMMEDIATELY UPON SUCCESS RESPONSE
            playNotificationSound();

            // 2. DISPLAY SUCCESS MESSAGE ON THE SAME PAGE
            msgDiv.innerText = successString + complaintId;
            msgDiv.style.display = "block";
            msgDiv.scrollIntoView({ behavior: 'smooth' });

            // 3. TRIGGER SYSTEM BROWSER NOTIFICATION
            triggerSystemNotification(activeLang, complaintId);

            // Reset Form Fields
            this.reset();
            previewImg.style.display = "none";
            imageFile = null;
            cameraPhotoDataUrl = null;
            stopCamera();
            
        } catch (err) {
            console.error("Submission operational failure:", err);
            alert("⚠️ Submission Failed: " + err.message);
        } finally {
            submitBtn.disabled = false;
        }
    });
</script>
</body>
</html>
