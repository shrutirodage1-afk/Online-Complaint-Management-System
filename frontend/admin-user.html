<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Users - Admin Panel</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#f4f6f9;
}

/* SIDEBAR */
.sidebar{
    width:230px;
    height:100vh;
    position:fixed;
    left:0;
    top:0;
    background:linear-gradient(135deg,#ff6a00,#ee0979);
    padding-top:20px;
    box-shadow:5px 0 20px rgba(0,0,0,0.15);
}

.sidebar h2{
    text-align:center;
    color:white;
    margin-bottom:30px;
}

.sidebar a{
    display:block;
    color:white;
    text-decoration:none;
    padding:15px 25px;
    margin:5px 10px;
    border-radius:10px;
    transition:0.3s;
}

.sidebar a:hover{
    background:rgba(255,255,255,0.2);
    transform:translateX(8px);
}

.sidebar .active{
    background:white;
    color:#ee0979;
    font-weight:bold;
}

/* MAIN */
.main-content{
    margin-left:250px;
    padding:30px;
}

.page-title{
    color:#ee0979;
    font-size:30px;
    margin-bottom:25px;
}

/* USER CARDS */
.users-container{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:20px;
}

.card{
    background:white;
    padding:20px;
    border-radius:15px;
    box-shadow:0 10px 20px rgba(0,0,0,0.1);
    transition:0.3s;
}

.card:hover{
    transform:translateY(-5px);
    box-shadow:0 15px 25px rgba(0,0,0,0.15);
}

.card h3{
    color:#ee0979;
    margin-bottom:10px;
}

.card p{
    margin:8px 0;
    color:#555;
}

/* STATUS */
.status{
    display:inline-block;
    background:#22c55e;
    color:white;
    padding:6px 14px;
    border-radius:20px;
    font-size:13px;
    margin-top:10px;
}

/* DELETE BUTTON */
.delete-btn{
    margin-top:15px;
    background:#ef4444;
    color:white;
    border:none;
    padding:10px 14px;
    border-radius:8px;
    cursor:pointer;
    transition:0.3s;
}

.delete-btn:hover{
    background:#dc2626;
    transform:scale(1.05);
}

/* NO USER */
.no-user{
    background:white;
    padding:30px;
    border-radius:15px;
    text-align:center;
    color:#777;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">

    <h2>ADMIN</h2>
<a href="admin-dash.html">🏠 Dashboard</a>
    <a href="admin-complaint.html">📋 Complaints</a>
    <a href="admin-user.html"class="active">👥 Users</a>
    <a href="admin-report.html">📊 Reports</a>
    <a href="admin-department.html">🔁 Switch Department</a>
    <a href="admin-logout.html">🚪 Logout</a>

</div>

<!-- MAIN CONTENT -->
<div class="main-content">

    <h1 class="page-title">👥 Registered Users</h1>

    <div class="users-container" id="userList"></div>

</div>

<script src="js/api.js"></script>
<script>

OCMC.requireAdmin();

// LOAD USERS
async function renderUsers(){

    let box =
        document.getElementById("userList");

    let users = [];
    try {
        const data = await OCMC.getAllUsers();
        users = data.users;
    } catch (err) {
        box.innerHTML = `<div class="no-user"><h3>⚠️ ${err.message}</h3></div>`;
        return;
    }

    box.innerHTML = "";

    if(users.length === 0){

        box.innerHTML = `
        <div class="no-user">
            <h3>No Users Registered Yet</h3>
        </div>
        `;

        return;
    }

    users.forEach((u)=>{

        box.innerHTML += `
        <div class="card">

            <h3>${u.name}</h3>

            <p><strong>Email:</strong> ${u.email}</p>

            <p><strong>Mobile:</strong> ${u.phone}</p>

            <span class="status">${u.status}</span>

            <br>

            <button
                class="delete-btn"
                onclick="deleteUser('${u.id}')">
                Delete User
            </button>

        </div>
        `;
    });
}

// DELETE USER
async function deleteUser(id){

    if(confirm("Are you sure you want to delete this user?")){
        try {
            await OCMC.deleteUser(id);
            renderUsers();
        } catch (err) {
            alert("⚠️ " + err.message);
        }
    }
}

// PAGE LOAD
window.onload = renderUsers;

</script>

</body>
</html>
