<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Track Complaint - OCMS</title>

<style>
:root {
    --bg-gradient: linear-gradient(135deg, #eef2f3 0%, #8e9eab 100%);
    --card-bg: #ffffff;
    --text-color: #333333;
    --heading-color: #ee0979;
    --border-color: #cccccc;
    --input-bg: #ffffff;
    --result-bg: #f9f9f9;
    --sidebar-bg: linear-gradient(135deg, #ff6a00, #ee0979);
    --sidebar-text: #ffffff;
    --card-shadow: rgba(0, 0, 0, 0.15);
    --btn-gradient: linear-gradient(135deg, #ff6a00, #ee0979);
}

[data-theme="dark"] {
    --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    --card-bg: #1e1e1e;
    --text-color: #e0e0e0;
    --heading-color: #ff5252;
    --border-color: #333333;
    --input-bg: #2d2d2d;
    --result-bg: #282828;
    --sidebar-bg: linear-gradient(135deg, #1e293b, #0f172a);
    --sidebar-text: #ffffff;
    --card-shadow: rgba(0, 0, 0, 0.5);
    --btn-gradient: linear-gradient(135deg, #e05600, #c40763);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins', sans-serif;
}

body{
    display:flex;
    height:100vh;
    background: var(--bg-gradient);
    color: var(--text-color);
    transition: background 0.3s ease, color 0.3s ease;
}

/* SIDEBAR */
.sidebar{
    width:230px;
    background: var(--sidebar-bg);
    color: var(--sidebar-text);
    padding:20px;
    transition: background 0.3s ease;
}

.sidebar h2{
    text-align:center;
    margin-bottom:30px;
}

.sidebar a{
    display:block;
    color: var(--sidebar-text);
    text-decoration:none;
    padding:15px 25px;
    margin:5px 0;
    border-radius:8px;
    transition:0.3s;
}

.sidebar a:hover{
    background:rgba(255,255,255,0.2);
}

.sidebar a.active {
    background: rgba(255, 255, 255, 0.25);
    border-left: 4px solid white;
}

/* MAIN */
.main{
    flex:1;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction: column;
    padding: 20px;
}

/* CARD */
.card{
    width:500px;
    background: var(--card-bg);
    padding:25px;
    border-radius:15px;
    box-shadow:0 10px 25px var(--card-shadow);
    transition: background 0.3s ease, box-shadow 0.3s ease;
}

.card-header-box {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
}

.controls-wrapper {
    display: flex;
    gap: 10px;
    align-items: center;
}

.card h2{
    color: var(--heading-color);
}

input{
    width:100%;
    padding:10px;
    margin:10px 0;
    border-radius:8px;
    border:1px solid var(--border-color);
    background: var(--input-bg);
    color: var(--text-color);
    font-family: 'Poppins', sans-serif;
}

button.btn-primary {
    width:100%;
    padding:10px;
    border:none;
    border-radius:8px;
    background: var(--btn-gradient);
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
}

button.btn-primary:hover{
    transform:scale(1.02);
}

/* RESULT BOX */
.result{
    margin-top:15px;
    padding:15px;
    background: var(--result-bg);
    border-radius:10px;
    display:none;
}

.result code {
    background: var(--input-bg);
    padding: 2px 6px;
    border-radius: 4px;
}

/* IMAGE STYLE */
.result img{
    width:100%;
    margin-top:10px;
    border-radius:10px;
}

.lang-switcher select, .theme-toggle button {
    padding: 6px 10px;
    border-radius: 8px;
    border: 1px solid var(--border-color);
    background: var(--input-bg);
    color: var(--text-color);
    cursor: pointer;
    font-family: 'Poppins', sans-serif;
    font-size: 14px;
}

.theme-toggle button {
    display: flex;
    align-items: center;
    gap: 5px;
}
</style>
</head>

<body>

<div class="sidebar">
    <h2>OCMS</h2>
    <a href="dashboard.html" data-i18n="nav_dashboard">🏠 Dashboard</a>
    <a href="submitcomplaint.html" data-i18n="nav_submit">📝 Submit Complaint</a>
    <a href="my-complaint.html" data-i18n="nav_myComplaints">📋 My Complaints</a>
    <a href="track-complaint.html" class="active" data-i18n="nav_track">🔍 Track Complaint</a>
    <a href="profile.html" data-i18n="nav_profile">👤 Profile</a>
    <a href="notification.html" data-i18n="nav_notifications">🔔 Notifications</a>
    <a href="logout.html" data-i18n="nav_logout">🚪 Logout</a>
</div>

<div class="main">
<div class="card">

    <div class="card-header-box">
        <h2 data-i18n="track_title">🔍 Track Complaint</h2>
        <div class="controls-wrapper">
            <div class="theme-toggle">
                <button type="button" id="themeBtn">
                    <span id="themeIcon">🌙</span>
                    <span id="themeText" data-i18n="theme_dark">Dark</span>
                </button>
            </div>
            <div class="lang-switcher">
                <select id="langSelect">
                    <option value="en">English</option>
                    <option value="hi">हिन्दी</option>
                    <option value="mr">मराठी</option>
                    <option value="es">Español</option>
                </select>
            </div>
        </div>
    </div>

    <input type="text" id="complaintId" placeholder="Enter Complaint ID" data-i18n-holder="track_place">
    <button class="btn-primary" onclick="trackComplaint()" data-i18n="btn_track">Track Complaint</button>

    <div id="result" class="result"></div>

</div>
</div>

<script src="js/api.js"></script>
<script>
const translations = {
    en: {
        nav_dashboard: "🏠 Dashboard",
        nav_submit: "📝 Submit Complaint",
        nav_myComplaints: "📋 My Complaints",
        nav_track: "🔍 Track Complaint",
        nav_profile: "👤 Profile",
        nav_notifications: "🔔 Notifications",
        nav_logout: "🚪 Logout",
        track_title: "🔍 Track Complaint",
        track_place: "Enter Complaint ID",
        btn_track: "Track Complaint",
        searching: "Searching...",
        not_found: "Complaint Not Found",
        alert_empty: "Please enter Complaint ID",
        no_img: "No Image Uploaded",
        lbl_id: "Complaint ID",
        lbl_title: "Title",
        lbl_category: "Category",
        lbl_description: "Description",
        lbl_location: "Location",
        lbl_status: "Status",
        lbl_date: "Date",
        lbl_proof: "🔑 Proof Passcode",
        theme_light: "Light",
        theme_dark: "Dark"
    },
    hi: {
        nav_dashboard: "🏠 डैशबोर्ड",
        nav_submit: "📝 शिकायत दर्ज करें",
        nav_myComplaints: "📋 मेरी शिकायतें",
        nav_track: "🔍 शिकायत ट्रैक करें",
        nav_profile: "👤 प्रोफ़ाइल",
        nav_notifications: "🔔 सूचनाएं",
        nav_logout: "🚪 लॉगआउट",
        track_title: "🔍 ट्रैक शिकायत",
        track_place: "शिकायत आईडी दर्ज करें",
        btn_track: "ट्रैक करें",
        searching: "खोज की जा रही है...",
        not_found: "शिकायत नहीं मिली",
        alert_empty: "कृपया शिकायत आईडी दर्ज करें",
        no_img: "कोई छवि अपलोड नहीं की गई",
        lbl_id: "शिकायत आईडी",
        lbl_title: "शीर्षक",
        lbl_category: "श्रेणी",
        lbl_description: "विवरण",
        lbl_location: "स्थान",
        lbl_status: "स्थिति",
        lbl_date: "दिनांक",
        lbl_proof: "🔑 प्रमाण पासकोड",
        theme_light: "लाइट",
        theme_dark: "डार्क"
    },
    mr: {
        nav_dashboard: "🏠 डॅशबोर्ड",
        nav_submit: "📝 तक्रार नोंदवा",
        nav_myComplaints: "📋 माझ्या तक्रारी",
        nav_track: "🔍 तक्रार ट्रॅक करा",
        nav_profile: "👤 प्रोफाइल",
        nav_notifications: "🔔 सूचना",
        nav_logout: "🚪 लॉगआउट",
        track_title: "🔍 तक्रार ट्रॅक करा",
        track_place: "तक्रार आयडी प्रविष्ट करा",
        btn_track: "तक्रार ट्रॅक करा",
        searching: "शोधत आहे...",
        not_found: "तक्रार आढळली नाही",
        alert_empty: "कृपया तक्रार आयडी प्रविष्ट करा",
        no_img: "फोटो अपलोड केला नाही",
        lbl_id: "तक्रार आयडी",
        lbl_title: "शीर्षक",
        lbl_category: "वर्ग",
        lbl_description: "वर्णन",
        lbl_location: "ठिकाण",
        lbl_status: "स्थिती",
        lbl_date: "दिनांक",
        lbl_proof: "🔑 पुरावा पासकोड",
        theme_light: "लाइट",
        theme_dark: "डार्क"
    },
    es: {
        nav_dashboard: "🏠 Panel",
        nav_submit: "📝 Enviar Queja",
        nav_myComplaints: "📋 Mis Quejas",
        nav_track: "🔍 Rastrear Queja",
        nav_profile: "👤 Perfil",
        nav_notifications: "🔔 Notificaciones",
        nav_logout: "🚪 Cerrar Sesión",
        track_title: "🔍 Rastrear Queja",
        track_place: "Ingrese ID de la Queja",
        btn_track: "Rastrear Queja",
        searching: "Buscando...",
        not_found: "Queja No Encontrada",
        alert_empty: "Por favor ingrese el ID de la queja",
        no_img: "Sin imagen subida",
        lbl_id: "ID de la Queja",
        lbl_title: "Título",
        lbl_category: "Categoría",
        lbl_description: "Descripción",
        lbl_location: "Ubicación",
        lbl_status: "Estado",
        lbl_date: "Fecha",
        lbl_proof: "🔑 Código de Prueba",
        theme_light: "Claro",
        theme_dark: "Oscuro"
    }
};

let activeComplaint = null;
let searchState = ""; 

// ===== Dark / Light Theme Logic =====
const themeBtn = document.getElementById("themeBtn");
const themeIcon = document.getElementById("themeIcon");
const themeText = document.getElementById("themeText");

function getSavedTheme() {
    return localStorage.getItem("ocms_theme") || "light";
}

function applyTheme(theme) {
    document.documentElement.setAttribute("data-theme", theme);
    localStorage.setItem("ocms_theme", theme);
    
    if (theme === "dark") {
        themeIcon.textContent = "☀️";
        themeText.setAttribute("data-i18n", "theme_light");
    } else {
        themeIcon.textContent = "🌙";
        themeText.setAttribute("data-i18n", "theme_dark");
    }
    applyTranslations(getSavedLang());
}

themeBtn.addEventListener("click", () => {
    const currentTheme = getSavedTheme();
    const newTheme = currentTheme === "dark" ? "light" : "dark";
    applyTheme(newTheme);
});

// Apply initial theme
applyTheme(getSavedTheme());

function getSavedLang() { return localStorage.getItem("ocms_lang") || "en"; }
function setSavedLang(lang) { localStorage.setItem("ocms_lang", lang); }

function applyTranslations(lang) {
    const dict = translations[lang] || translations.en;
    document.querySelectorAll("[data-i18n]").forEach(el => {
        const key = el.getAttribute("data-i18n");
        if (dict[key]) el.textContent = dict[key];
    });
    document.querySelectorAll("[data-i18n-holder]").forEach(el => {
        const key = el.getAttribute("data-i18n-holder");
        if (dict[key]) el.placeholder = dict[key];
    });
    document.documentElement.lang = lang;
    renderResult(lang);
}

function renderResult(lang) {
    const dict = translations[lang] || translations.en;
    const resultBox = document.getElementById("result");

    if (searchState === "searching") {
        resultBox.style.display = "block";
        resultBox.innerHTML = `<p>${dict.searching}</p>`;
        return;
    }
    if (searchState === "error") {
        resultBox.style.display = "block";
        resultBox.innerHTML = `<p style="color:#ff5252;font-weight:bold;">${dict.not_found}</p>`;
        return;
    }
    if (!activeComplaint) {
        resultBox.style.display = "none";
        return;
    }

    resultBox.style.display = "block";
    resultBox.innerHTML = `
        <p><b>${dict.lbl_id}:</b> ${activeComplaint.complaintId}</p>
        <p><b>${dict.lbl_title}:</b> ${activeComplaint.title}</p>
        <p><b>${dict.lbl_category}:</b> ${activeComplaint.category}</p>
        <p><b>${dict.lbl_description}:</b> ${activeComplaint.description || "-"}</p>
        <p><b>${dict.lbl_location}:</b> ${activeComplaint.location || "-"}</p>
        <p><b>${dict.lbl_status}:</b> <span style="color:var(--heading-color);font-weight:bold;">${activeComplaint.status}</span></p>
        <p><b>${dict.lbl_date}:</b> ${new Date(activeComplaint.createdAt).toLocaleString()}</p>
        ${activeComplaint.status === "Closed" && activeComplaint.resolutionCode ? `<p><b>${dict.lbl_proof}:</b> <code>${activeComplaint.resolutionCode}</code></p>` : ""}
        ${activeComplaint.image ? `<img src="${OCMC.imageUrl(activeComplaint.image)}">` : `<p>${dict.no_img}</p>`}
    `;
}

const langSelect = document.getElementById("langSelect");
const initialLang = getSavedLang();
langSelect.value = initialLang;

langSelect.addEventListener("change", (e) => {
    const lang = e.target.value;
    setSavedLang(lang);
    applyTranslations(lang);
});

async function trackComplaint(){
    const id = document.getElementById("complaintId").value.trim().toUpperCase();
    const currentLang = langSelect.value;
    const dict = translations[currentLang] || translations.en;

    if(!id){
        alert(dict.alert_empty);
        return;
    }

    searchState = "searching";
    activeComplaint = null;
    renderResult(currentLang);

    try {
        const data = await OCMC.trackComplaint(id);
        activeComplaint = data.complaint;
        searchState = "success";
    } catch (err) {
        searchState = "error";
    }
    renderResult(currentLang);
}

applyTranslations(initialLang);
</script>
</body>
</html>
