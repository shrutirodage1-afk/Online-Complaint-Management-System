<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile Page</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body {
    background: #f4f6f9;
}

/* SIDEBAR */
.sidebar {
    width: 230px;
    height: 100vh;
    position: fixed;
    left: 0;
    top: 0;
    background: linear-gradient(135deg, #ff6a00, #ee0979);
    padding-top: 20px;
}

.sidebar h2 {
    text-align: center;
    color: white;
    margin-bottom: 30px;
}

.sidebar a {
    display: block;
    color: white;
    text-decoration: none;
    padding: 15px 25px;
    transition: 0.3s;
    border-radius: 10px;
    margin: 5px 10px;
}

.sidebar a:hover {
    background: rgba(255,255,255,0.2);
    transform: translateX(5px);
}

.sidebar a.active {
    background: rgba(255,255,255,0.25);
    font-weight: bold;
    border-left: 4px solid white;
}

/* MAIN */
.main {
    margin-left: 230px;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    padding: 20px;
}

/* CARD */
.profile-container {
    width: 450px;
    background: white;
    padding: 25px;
    border-radius: 20px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    text-align: center;
}

.profile-header-box {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
}

h2 {
    color: #ee0979;
}

/* PROFILE IMAGE */
.profile-pic img {
    width: 130px;
    height: 130px;
    border-radius: 50%;
    object-fit: cover;
    border: 4px solid #ee0979;
    cursor: pointer;
    transition: 0.3s;
    margin-bottom: 10px;
}

.profile-pic img:hover {
    transform: scale(1.08);
}

/* BUTTONS */
.btn {
    padding: 8px 12px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    margin: 5px;
    font-size: 13px;
    font-family: 'Poppins', sans-serif;
}

.camera-btn { background: #2563eb; color: white; }
.gallery-btn { background: #10b981; color: white; }
.edit-btn { background: #6b7280; color: white; }
.delete-btn { background: #ef4444; color: white; }

.save-btn {
    background: #ee0979;
    color: white;
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: none;
    font-weight: bold;
    cursor: pointer;
}

/* INPUTS */
input, textarea {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    margin-bottom: 10px;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-family: 'Poppins', sans-serif;
}

input:disabled, textarea:disabled {
    background: #f3f3f3;
}

/* MODAL */
.modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.7);
    justify-content: center;
    align-items: center;
}

.modal-content {
    background: white;
    padding: 20px;
    border-radius: 15px;
    text-align: center;
}

video {
    width: 300px;
    border-radius: 10px;
}

.lang-switcher select {
    padding: 6px 10px;
    border-radius: 8px;
    border: 1px solid #ddd;
    background: white;
    color: #333;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="sidebar">
    <h2>OCMS</h2>
    <a href="dashboard.html" data-i18n="nav_dashboard">🏠 Dashboard</a>
    <a href="submitcomplaint.html" data-i18n="nav_submit">📝 Submit Complaint</a>
    <a href="my-complaint.html" data-i18n="nav_myComplaints">📋 My Complaints</a>
    <a href="track-complaint.html" data-i18n="nav_track">🔍 Track Complaint</a>
    <a href="profile.html" class="active" data-i18n="nav_profile">👤 Profile</a>
 
    <a href="logout.html" data-i18n="nav_logout">🚪 Logout</a>
</div>

<div class="main">
<div class="profile-container">

    <div class="profile-header-box">
        <h2 data-i18n="prof_title">My Profile</h2>
        <div class="lang-switcher">
            <select id="langSelect">
                <option value="en">English</option>
                <option value="hi">हिन्दी</option>
                <option value="mr">मराठी</option>
                <option value="es">Español</option>
            </select>
        </div>
    </div>

    <div class="profile-pic">
        <img id="preview" src="https://via.placeholder.com/130">
    </div>

    <button class="btn camera-btn" onclick="openCamera()" data-i18n="btn_camera">📷 Camera</button>
    <button class="btn gallery-btn" onclick="openGallery()" data-i18n="btn_gallery">🖼 Gallery</button>
    <button class="btn delete-btn" onclick="deletePhoto()" data-i18n="btn_delete">🗑 Delete</button>
    <button class="btn edit-btn" onclick="enableEdit()" data-i18n="btn_edit">✏ Edit</button>

    <div style="text-align:left;margin-top:15px;">
        <label data-i18n="lbl_name">Full Name</label>
        <input id="name" value="" disabled>

        <label data-i18n="lbl_email">Email</label>
        <input id="email" value="" disabled>

        <label data-i18n="lbl_mobile">Mobile</label>
        <input id="mobile" value="" disabled>

        <label data-i18n="lbl_address">Address</label>
        <textarea id="address" disabled></textarea>
    </div>

    <br>
    <button class="save-btn" onclick="saveProfile()" data-i18n="btn_save">Save Changes</button>

</div>
</div>

<div class="modal" id="cameraModal">
    <div class="modal-content">
        <video id="video" autoplay></video>
        <br><br>
        <button class="btn camera-btn" onclick="capturePhoto()" data-i18n="btn_capture">📸 Capture</button>
        <button class="btn edit-btn" onclick="closeCamera()" data-i18n="btn_close">❌ Close</button>
    </div>
</div>

<input type="file" id="fileInput" accept="image/*" hidden>

<script src="js/api.js"></script>
<script>
const translations = {
    en: {
        nav_dashboard: "🏠 Dashboard",
        nav_submit: "📝 Submit Complaint",
        nav_myComplaints: "📋 My Complaints",
        nav_track: "🔍 Track Complaint",
        nav_profile: "👤 Profile",
        
        nav_logout: "🚪 Logout",
        prof_title: "My Profile",
        btn_camera: "📷 Camera",
        btn_gallery: "🖼 Gallery",
        btn_delete: "🗑 Delete",
        btn_edit: "✏ Edit",
        btn_save: "Save Changes",
        btn_capture: "📸 Capture",
        btn_close: "❌ Close",
        lbl_name: "Full Name",
        lbl_email: "Email",
        lbl_mobile: "Mobile",
        lbl_address: "Address",
        cam_error: "Camera not allowed",
        success_alert: "Profile Updated Successfully!"
    },
    hi: {
        nav_dashboard: "🏠 डैशबोर्ड",
        nav_submit: "📝 शिकायत दर्ज करें",
        nav_myComplaints: "📋 मेरी शिकायतें",
        nav_track: "🔍 शिकायत ट्रैक करें",
        nav_profile: "👤 प्रोफ़ाइल",
    
        nav_logout: "🚪 लॉगआउट",
        prof_title: "मेरी प्रोफाइल",
        btn_camera: "📷 कैमरा",
        btn_gallery: "🖼 गैलरी",
        btn_delete: "🗑 हटाएं",
        btn_edit: "✏ संपादित करें",
        btn_save: "बदलाव सहेजें",
        btn_capture: "📸 कैप्चर करें",
        btn_close: "❌ बंद करें",
        lbl_name: "पूरा नाम",
        lbl_email: "ईमेल",
        lbl_mobile: "मोबाइल नंबर",
        lbl_address: "पता",
        cam_error: "कैमरा एक्सेस की अनुमति नहीं है",
        success_alert: "प्रोफ़ाइल सफलतापूर्वक अपडेट की गई!"
    },
    mr: {
        nav_dashboard: "🏠 डॅशबोर्ड",
        nav_submit: "📝 तक्रार नोंदवा",
        nav_myComplaints: "📋 माझ्या तक्रारी",
        nav_track: "🔍 तक्रार ट्रॅक करा",
        nav_profile: "👤 प्रोफाइल",
       
        nav_logout: "🚪 लॉगआउट",
        prof_title: "माझी प्रोफाइल",
        btn_camera: "📷 कॅमेरा",
        btn_gallery: "🖼 गॅलरी",
        btn_delete: "🗑 हटवा",
        btn_edit: "✏ संपादन करा",
        btn_save: "बदल जतन करा",
        btn_capture: "📸 फोटो काढा",
        btn_close: "❌ बंद करा",
        lbl_name: "पूर्ण नाव",
        lbl_email: "ईमेल",
        lbl_mobile: "मोबाईल नंबर",
        lbl_address: "पत्ता",
        cam_error: "कॅमेरा वापरण्याची परवानगी नाही",
        success_alert: "प्रोफाइल यशस्वीरित्या अपडेट झाली!"
    },
    es: {
        nav_dashboard: "🏠 Panel",
        nav_submit: "📝 Enviar Queja",
        nav_myComplaints: "📋 Mis Quejas",
        nav_track: "🔍 Rastrear Queja",
        nav_profile: "👤 Perfil",
       
        nav_logout: "🚪 Cerrar Sesión",
        prof_title: "Mi Perfil",
        btn_camera: "📷 Cámara",
        btn_gallery: "🖼 Galería",
        btn_delete: "🗑 Eliminar",
        btn_edit: "✏ Editar",
        btn_save: "Guardar Cambios",
        btn_capture: "📸 Capturar",
        btn_close: "❌ Cerrar",
        lbl_name: "Nombre Completo",
        lbl_email: "Correo Electrónico",
        lbl_mobile: "Móvil",
        lbl_address: "Dirección",
        cam_error: "Cámara no permitida",
        success_alert: "¡Perfil actualizado con éxito!"
    }
};

function getSavedLang() { return localStorage.getItem("ocms_lang") || "en"; }
function setSavedLang(lang) { localStorage.setItem("ocms_lang", lang); }

function applyTranslations(lang) {
    const dict = translations[lang] || translations.en;
    document.querySelectorAll("[data-i18n]").forEach(el => {
        const key = el.getAttribute("data-i18n");
        if (dict[key]) el.textContent = dict[key];
    });
    document.documentElement.lang = lang;
}

const langSelect = document.getElementById("langSelect");
const initialLang = getSavedLang();
langSelect.value = initialLang;

langSelect.addEventListener("change", (e) => {
    const lang = e.target.value;
    setSavedLang(lang);
    applyTranslations(lang);
});

OCMC.requireAuth();

let stream;
let avatarFile = null;

async function loadProfile(){
    try {
        const data = await OCMC.getProfile();
        const u = data.user;
        document.getElementById("name").value = u.name || "";
        document.getElementById("email").value = u.email || "";
        document.getElementById("mobile").value = u.phone || "";
        document.getElementById("address").value = u.address || "";
        if (u.avatar) document.getElementById("preview").src = OCMC.imageUrl(u.avatar);
    } catch (err) {
        alert("⚠️ " + err.message);
    }
}

function openCamera() {
    const dict = translations[langSelect.value] || translations.en;
    document.getElementById("cameraModal").style.display = "flex";

    navigator.mediaDevices.getUserMedia({ video: true })
    .then(s => {
        stream = s;
        document.getElementById("video").srcObject = stream;
    })
    .catch(() => alert(dict.cam_error));
}

function capturePhoto() {
    const video = document.getElementById("video");
    const canvas = document.createElement("canvas");

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    const ctx = canvas.getContext("2d");
    ctx.drawImage(video, 0, 0);

    canvas.toBlob(blob => {
        avatarFile = new File([blob], "avatar.png", { type: "image/png" });
        document.getElementById("preview").src = canvas.toDataURL("image/png");
    });

    closeCamera();
}

function closeCamera() {
    document.getElementById("cameraModal").style.display = "none";
    if (stream) {
        stream.getTracks().forEach(t => t.stop());
    }
}

function openGallery() {
    document.getElementById("fileInput").click();
}

document.getElementById("fileInput").addEventListener("change", function() {
    if (this.files[0]) {
        avatarFile = this.files[0];
        document.getElementById("preview").src = URL.createObjectURL(this.files[0]);
    }
});

function deletePhoto() {
    avatarFile = null;
    document.getElementById("preview").src = "https://via.placeholder.com/130";
}

function enableEdit() {
    document.getElementById("name").disabled = false;
    document.getElementById("email").disabled = false;
    document.getElementById("mobile").disabled = false;
    document.getElementById("address").disabled = false;
}

async function saveProfile() {
    const dict = translations[langSelect.value] || translations.en;
    const formData = new FormData();
    formData.append("name", document.getElementById("name").value);
    formData.append("email", document.getElementById("email").value);
    formData.append("phone", document.getElementById("mobile").value);
    formData.append("address", document.getElementById("address").value);
    if (avatarFile) formData.append("avatar", avatarFile);

    try {
        const data = await OCMC.updateProfile(formData);
        const session = OCMC.getUser();
        OCMC.setSession(OCMC.getToken(), { ...session, ...data.user });

        document.getElementById("name").disabled = true;
        document.getElementById("email").disabled = true;
        document.getElementById("mobile").disabled = true;
        document.getElementById("address").disabled = true;

        alert(dict.success_alert);
    } catch (err) {
        alert("⚠️ " + err.message);
    }
}

applyTranslations(initialLang);
loadProfile();
</script>
</body>
</html>
