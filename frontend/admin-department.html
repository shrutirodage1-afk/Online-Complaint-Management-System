<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Department - OCMS</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff6a00, #ee0979);
            padding: 30px;
            overflow-x: hidden; /* Clean bounds during entry bounce */
        }

        /* ---------------- UNIQUE ANIMATIONS ---------------- */
        @keyframes scaleUpContainer {
            from {
                opacity: 0;
                transform: scale(0.92) translateY(15px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        @keyframes cardPopIn {
            0% {
                opacity: 0;
                transform: translateY(40px) scale(0.95);
            }
            70% {
                transform: translateY(-4px) scale(1.02);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Container Card */
        .dept-container {
            width: 100%;
            max-width: 720px;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            
            /* Main base container entry */
            animation: scaleUpContainer 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Top bar */
        .top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            animation: fadeIn 0.5s ease-out 0.2s both;
        }

        .back-btn {
            display: inline-block;
            padding: 8px 18px;
            border-radius: 10px;
            background: linear-gradient(135deg, #ff6a00, #ee0979);
            color: white;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(238, 9, 121, 0.3);
        }

        .back-btn:hover {
            transform: translateX(-3px);
            box-shadow: 0 6px 15px rgba(238, 9, 121, 0.5);
        }

        .admin-name-tag {
            background: linear-gradient(135deg, #ff6a00, #ee0979);
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }

        /* Logo Header */
        .logo {
            text-align: center;
            margin-bottom: 10px;
            animation: fadeIn 0.6s ease-out 0.3s both;
        }

        .logo h1 {
            color: #ee0979;
            font-size: 30px;
        }

        .logo p {
            color: #666;
            margin-top: 5px;
        }

        /* Department Grid Layout */
        .dept-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-top: 30px;
        }

        /* Sequential Grid Staggering Config */
        .dept-card:nth-child(1) { animation: cardPopIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.4s both; }
        .dept-card:nth-child(2) { animation: cardPopIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.5s both; }
        .dept-card:nth-child(3) { animation: cardPopIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.6s both; }
        .dept-card:nth-child(4) { animation: cardPopIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.7s both; }

        .dept-card {
            border: 2px solid #eee;
            border-radius: 16px;
            padding: 26px 20px;
            text-align: center;
            cursor: pointer;
            text-decoration: none;
            color: #333;
            transition: transform 0.3s, border-color 0.3s, box-shadow 0.3s, background 0.3s;
            background: #fafafa;
        }

        .dept-card:hover {
            transform: translateY(-6px) scale(1.02);
            border-color: #ee0979;
            box-shadow: 0 10px 25px rgba(238, 9, 121, 0.25);
            background: white;
        }

        .dept-icon {
            font-size: 42px;
            margin-bottom: 12px;
            transition: transform 0.3s ease;
        }
        
        .dept-card:hover .dept-icon {
            transform: scale(1.15);
        }

        .dept-card h3 {
            color: #ee0979;
            font-size: 19px;
            margin-bottom: 6px;
        }

        .dept-card p {
            font-size: 13px;
            color: #777;
        }

        /* Footer */
        .footer {
            text-align: center;
            margin-top: 30px;
            color: #999;
            font-size: 12px;
            animation: fadeIn 0.5s ease-out 0.8s both;
        }

        @media (max-width: 500px) {
            .dept-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="dept-container">

        <div class="top-row">
            <a href="admin-login.html" class="back-btn">← Back</a>
            <span class="admin-name-tag" id="adminNameTag">Admin</span>
        </div>

        <div class="logo">
            <h1>OCMS</h1>
            <p>Select the department you want to manage</p>
        </div>

        <div class="dept-grid">

            <a href="admin-dash.html" class="dept-card" onclick="selectDepartment('electricity', 'Electricity')">
                <div class="dept-icon">⚡</div>
                <h3>Electricity</h3>
                <p>Power &amp; electrical complaints</p>
            </a>

            <a href="admin-dash.html" class="dept-card" onclick="selectDepartment('water', 'Water Issue')">
                <div class="dept-icon">💧</div>
                <h3>Water</h3>
                <p>Water supply &amp; leakage complaints</p>
            </a>

            <a href="admin-dash.html" class="dept-card" onclick="selectDepartment('road', 'Road Problem')">
                <div class="dept-icon">🛣️</div>
                <h3>Road</h3>
                <p>Road &amp; infrastructure complaints</p>
            </a>

            <a href="admin-dash.html" class="dept-card" onclick="selectDepartment('others', 'Others')">
                <div class="dept-icon">📋</div>
                <h3>Others</h3>
                <p>General / miscellaneous complaints</p>
            </a>

        </div>

        <div class="footer">
            © 2026 Online Complaint Management System
        </div>

    </div>

    <script src="js/api.js"></script>
    <script>
        if (typeof OCMC !== 'undefined' && OCMC.requireAdmin) {
            OCMC.requireAdmin();
        }

        (function () {
            const user = (typeof OCMC !== 'undefined' && OCMC.getUser) ? OCMC.getUser() : null;
            if (user) {
                document.getElementById("adminNameTag").innerText = user.name || user.email || "Admin";
            }
        })();

        function selectDepartment(deptKey, deptLabel) {
            localStorage.setItem("ocms_admin_department", deptKey);
            localStorage.setItem("ocms_admin_department_label", deptLabel);
        }
    </script>

</body>
</html>
