<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - OCMS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff6a00, #ee0979);
        }
        .container {
            width: 360px;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }
        .back-btn {
            display: inline-block;
            margin-bottom: 15px;
            padding: 8px 16px;
            border-radius: 8px;
            background: linear-gradient(135deg, #ff6a00, #ee0979);
            color: white;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }
        .back-btn:hover {
            transform: translateX(-3px);
            box-shadow: 0 4px 10px rgba(238, 9, 121, 0.4);
        }
        h2 {
            text-align: center;
            color: #ee0979;
            margin-bottom: 20px;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        input:focus {
            border-color: #ee0979;
            box-shadow: 0 0 6px rgba(238, 9, 121, 0.4);
            outline: none;
        }
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            margin-top: 12px;
            transition: 0.3s;
        }
        .admin-btn { background: linear-gradient(135deg, #ff6a00, #ee0979); }
        .user-btn { background: linear-gradient(135deg, #00c6ff, #0072ff); }
        .btn:hover { transform: scale(1.03); }
    </style>
</head>
<body>

<div class="container">
    <a href="welcome.html" class="back-btn">← Back</a>
    <h2>Register</h2>

    <input type="text" id="name" placeholder="Full Name">
    <input type="email" id="email" placeholder="Email">
    <input type="tel" id="phone" placeholder="Mobile Number">
    <input type="password" id="password" placeholder="Password">
    <input type="password" id="confirmPassword" placeholder="Confirm Password">

    <!-- <button class="btn admin-btn" onclick="registerAdmin()">Register as Admin</button> -->
    <button class="btn user-btn" onclick="registerUser()">Register</button>
</div>

<script src="js/api.js"></script>
<script>
function validateForm(name, email, phone, password, confirmPassword) {
    if (!name || !email || !phone || !password || !confirmPassword) {
        alert("⚠️ All fields are required!");
        return false;
    }
    if (phone.length !== 10 || isNaN(phone)) {
        alert("⚠️ Enter valid 10-digit mobile number!");
        return false;
    }
    if (password !== confirmPassword) {
        alert("⚠️ Passwords do not match!");
        return false;
    }
    return true;
}

async function registerUser() {
    let name = document.getElementById("name").value.trim();
    let email = document.getElementById("email").value.trim();
    let phone = document.getElementById("phone").value.trim();
    let password = document.getElementById("password").value;
    let confirmPassword = document.getElementById("confirmPassword").value;

    if (!validateForm(name, email, phone, password, confirmPassword)) return;

    try {
        await OCMC.registerUser({ name, email, phone, password, confirmPassword });
        
        // Save name local storage to pull on the dashboard side
        localStorage.setItem("ocms_user_name", name);

        alert("✅ User Registered Successfully!");
        window.location.href = "dashboard.html"; // Redirecting directly to show functionality
    } catch (err) {
        alert("⚠️ " + err.message);
    }
}

async function registerAdmin() {
    let name = document.getElementById("name").value.trim();
    let email = document.getElementById("email").value.trim();
    let phone = document.getElementById("phone").value.trim();
    let password = document.getElementById("password").value;
    let confirmPassword = document.getElementById("confirmPassword").value;

    if (!validateForm(name, email, phone, password, confirmPassword)) return;

    try {
        await OCMC.registerAdmin({ name, email, phone, password, confirmPassword });
        
        localStorage.setItem("ocms_user_name", name);

        alert("✅ Admin Registered Successfully!");
        window.location.href = "dashboard.html";
    } catch (err) {
        alert("⚠️ " + err.message);
    }
}
</script>
</body>
</html>
